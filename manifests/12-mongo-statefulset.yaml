apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: todo-app
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: todo-app
spec:
  serviceName: mongo          # must match headless Service name in 11-mongo-headless-svc.yaml
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
        app.kubernetes.io/name: mongo
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: todo-app
    spec:
      # NOTE: runAsNonRoot is false because the official mongo image requires
      # root to initialise /data/db (chown to uid 999). Set to true only if
      # using a custom rootless mongo image.
      securityContext:
        runAsNonRoot: false
        fsGroup: 999            # mongo group — ensures PVC is writable by mongo user
      containers:
        - name: mongo
          # CI pipeline replaces :latest with :<git-sha> before apply
          image: 050752632489.dkr.ecr.eu-west-1.amazonaws.com/todo-database:latest
          imagePullPolicy: Always
          ports:
            - name: mongo
              containerPort: 27017
              protocol: TCP
          envFrom:
            - secretRef:
                name: mongo-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
        labels:
          app.kubernetes.io/part-of: todo-app
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3
        resources:
          requests:
            storage: 10Gi
